# Blueprint do Render: "New +" → "Blueprint" → escolha o repositório com este projeto.
services:
  - type: web
    name: live-world-3d
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ENABLE_TEST_EVENTS
        value: "0"
      - key: LOG_LEVEL
        value: info
